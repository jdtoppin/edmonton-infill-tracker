name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DATABASE_URL: postgresql://infill:infill-ci-password@localhost:5432/infill?schema=public
  APP_URL: http://127.0.0.1:3000
  AUTH_REQUIRED: "true"
  INITIAL_ADMIN_EMAIL: admin@example.test
  SEED_ADMIN_PASSWORD: ci-admin-password-not-for-production
  SEED_USER_EMAIL: user@example.test
  SEED_USER_PASSWORD: ci-user-password-not-for-production
  NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-placeholder

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: infill
          POSTGRES_USER: infill
          POSTGRES_PASSWORD: infill-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infill -d infill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Run integration tests
        run: npm run test:integration

  mac-installer:
    name: Mac installer safety
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Mac port and Tailscale route selection
        run: >-
          npx vitest run
          tests/integration/mac-port-selection.test.ts
          tests/integration/tailscale-serve-port-selection.test.ts
          tests/integration/foundation.test.ts

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: infill
          POSTGRES_USER: infill
          POSTGRES_PASSWORD: infill-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infill -d infill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Build production application
        run: npm run build

      - name: Build deployment image
        run: >-
          docker build
          --target runtime
          --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="$NEXT_PUBLIC_MAPBOX_TOKEN"
          --tag edmonton-infill-tracker:ci
          .

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality
      - integration
      - build
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: infill
          POSTGRES_USER: infill
          POSTGRES_PASSWORD: infill-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infill -d infill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Seed end-to-end fixtures
        run: npm run prisma:seed

      - name: Build application for browser tests
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
