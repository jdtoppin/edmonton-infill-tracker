name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "43 15 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DATABASE_URL: postgresql://infill:infill-ci-password@localhost:5432/infill?schema=public
  APP_URL: http://127.0.0.1:3000
  AUTH_REQUIRED: "true"
  INITIAL_ADMIN_EMAIL: admin@example.test
  SEED_ADMIN_PASSWORD: ci-admin-password-not-for-production
  SEED_USER_EMAIL: user@example.test
  SEED_USER_PASSWORD: ci-user-password-not-for-production

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Reject personal email addresses in pull-request commits
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$BASE_SHA:$HEAD_SHA" in
            ""|*[!0-9a-f:]*)
              echo "GitHub supplied an invalid commit range." >&2
              exit 1
              ;;
          esac
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          commit_email_file="$RUNNER_TEMP/commit-emails.tsv"
          git log --format='%H%x09%ae%x09%ce' "$BASE_SHA..$HEAD_SHA" > "$commit_email_file"
          invalid_email=0
          while IFS=$'\t' read -r commit_sha author_email committer_email; do
            for commit_email in "$author_email" "$committer_email"; do
              case "$commit_email" in
                *@users.noreply.github.com|noreply@github.com|noreply@openai.com) ;;
                *)
                  echo "::error title=Personal email in commit metadata::Commit $commit_sha uses a non-noreply author or committer address. Configure your GitHub noreply address and amend the commit."
                  invalid_email=1
                  ;;
              esac
            done
          done < "$commit_email_file"
          [ "$invalid_email" -eq 0 ]

      - name: Reject tracked credential and private-state files
        shell: bash
        run: |
          set -euo pipefail
          sensitive_file_found=0
          while IFS= read -r -d '' tracked_path; do
            case "$tracked_path" in
              .env.example) ;;
              .env|.env.*|*/.env|*/.env.*|.npmrc|*/.npmrc|.aws/*|*/.aws/*|.ssh/*|*/.ssh/*|.secrets/*|*/.secrets/*|.tailscale/*|*/.tailscale/*|playwright/.auth/*|*/playwright/.auth/*|credentials*.json|*/credentials*.json|client_secret*.json|*/client_secret*.json|application_default_credentials.json|*/application_default_credentials.json|service-account*.json|*/service-account*.json|secrets*.json|*/secrets*.json|tailscale*.json|*/tailscale*.json|tailscaled.state*|*/tailscaled.state*|docker-compose.override.yml|*/docker-compose.override.yml|compose.override.yml|*/compose.override.yml|*.key|*.p8|*.ppk|*.pem|*.cer|*.crt|*.der|*.p7b|*.p12|*.pfx|*.jks|*.keystore|id_rsa*|*/id_rsa*|id_ed25519*|*/id_ed25519*|*.sqlite|*.sqlite3|*.db|*.dump|*.dump.partial)
                echo "::error title=Sensitive file is tracked::$tracked_path must remain outside Git and Docker build contexts."
                sensitive_file_found=1
                ;;
            esac
          done < <(git ls-files -z)
          [ "$sensitive_file_found" -eq 0 ]

      - name: Verify audited Gitleaks exceptions
        shell: bash
        run: >-
          echo 'b95d20cdbec69a0187e7108396aa5cd357f2349aeb8efe46b3589ae932e3085a  .gitleaksignore'
          | sha256sum --check --strict

      - name: Download checksum-pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          gitleaks_archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$gitleaks_archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$gitleaks_archive" | sha256sum --check --strict
          tar -xzf "$gitleaks_archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan complete Git history for secrets
        shell: bash
        run: >-
          "$RUNNER_TEMP/gitleaks" git
          --no-banner
          --no-color
          --redact=100
          --max-archive-depth=2
          --log-opts=--all
          .

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOW_DATABASE_INTEGRATION_TESTS: "true"
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: infill
          POSTGRES_USER: infill
          POSTGRES_PASSWORD: infill-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infill -d infill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Run integration tests
        run: npm run test:integration

  mac-installer:
    name: Mac installer safety
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Mac port and Tailscale route selection
        run: >-
          npx vitest run
          tests/integration/mac-port-selection.test.ts
          tests/integration/tailscale-serve-port-selection.test.ts
          tests/integration/foundation.test.ts

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: infill
          POSTGRES_USER: infill
          POSTGRES_PASSWORD: infill-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infill -d infill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Build production application
        run: npm run build

      - name: Build deployment image
        run: >-
          docker build
          --target runtime
          --build-arg APP_BUILD_SHA="$GITHUB_SHA"
          --tag edmonton-infill-tracker:ci
          .

  container-security:
    name: Container security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build application image
        run: >-
          docker build
          --target runtime
          --build-arg APP_BUILD_SHA="$GITHUB_SHA"
          --tag edmonton-infill-tracker:security-scan
          .

      - name: Build PostGIS image
        run: >-
          docker build
          --tag edmonton-infill-postgis:security-scan
          deploy/postgis

      - name: Pull pinned Caddy image
        run: docker pull caddy:2.11.4-alpine

      - name: Validate application runtime image
        run: docker run --rm --entrypoint node edmonton-infill-tracker:security-scan --version

      - name: Validate pinned npm runtime
        shell: bash
        run: |
          set -euo pipefail
          expected_npm=$(sed -n 's/^ARG NPM_VERSION=//p' Dockerfile)
          printf '%s\n' "$expected_npm" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          actual_npm=$(docker run --rm --entrypoint npm edmonton-infill-tracker:security-scan --version)
          [ "$actual_npm" = "$expected_npm" ] || {
            printf 'Expected npm %s, found %s\n' "$expected_npm" "$actual_npm" >&2
            exit 1
          }

      - name: Validate Caddy configuration
        run: >-
          docker run
          --rm
          --volume "$GITHUB_WORKSPACE/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile

      - name: Validate PostGIS runtime image
        shell: bash
        run: |
          set -euo pipefail
          database_container="support-postgis-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$database_container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name "$database_container" \
            --env POSTGRES_DB=infill \
            --env POSTGRES_USER=infill \
            --env POSTGRES_PASSWORD=ci-postgis-password \
            edmonton-infill-postgis:security-scan
          ready=0
          postgis_version=""
          for attempt in $(seq 1 30); do
            if postgis_version=$(docker exec "$database_container" \
              psql --username infill --dbname infill --tuples-only --command 'SELECT PostGIS_Version();' \
              2>/dev/null); then
              ready=1
              break
            fi
            sleep 2
          done
          [ "$ready" -eq 1 ] || {
            docker logs "$database_container"
            exit 1
          }
          printf 'PostGIS runtime: %s\n' "$postgis_version"

      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: edmonton-infill-tracker:security-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan PostGIS image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: edmonton-infill-postgis:security-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan Caddy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: caddy:2.11.4-alpine
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality
      - integration
      - build
      - container-security
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: infill
          POSTGRES_USER: infill
          POSTGRES_PASSWORD: infill-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infill -d infill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Seed end-to-end fixtures
        run: npm run prisma:seed

      - name: Build application for browser tests
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
