version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Edmonton
    open-pull-requests-limit: 10
    rebase-strategy: auto
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Edmonton
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

# Node.js, npm, npm's bundled brace-expansion security override, Caddy, and PostgreSQL
# are pinned in coordinated deployment files. The support-component workflow updates
# those same-major pins together, runs full CI, and opens a human-reviewed PR without
# deploying it.
