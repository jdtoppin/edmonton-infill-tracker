name: edmonton-infill-tracker

x-app-image: &app-image
  image: edmonton-infill-tracker:${APP_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
    args:
      NODE_VERSION: ${NODE_VERSION:-22.23.1}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}

x-app-runtime: &app-runtime
  <<: *app-image
  env_file:
    - path: .env
      required: true
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-infill}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-infill}?schema=public
    NODE_ENV: production
  networks:
    app_egress:
      gw_priority: 1
    database:
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:uid=1000,gid=1000,mode=1777
    - /app/.wrangler:uid=1000,gid=1000,mode=0750
  logging: &bounded-logs
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  db:
    build:
      context: ./deploy/postgis
      dockerfile: Dockerfile
    image: edmonton-infill-postgis:${POSTGIS_IMAGE_TAG:-17.9-3}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infill}
      POSTGRES_USER: ${POSTGRES_USER:-infill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    shm_size: 256mb
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" && psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc 'SELECT PostGIS_Version()' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logs

  migrate:
    <<: *app-runtime
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app-runtime
    command: ["web"]
    expose:
      - "3000"
    volumes:
      - next_cache:/app/.next/cache
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app-runtime
    command: ["worker"]
    restart: unless-stopped
    stop_grace_period: 1m
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app-runtime
    command: ["scheduler"]
    restart: unless-stopped
    stop_grace_period: 1m
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - ${HOST_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80
      - ${HOST_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443
      - ${HOST_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443/udp
    volumes:
      - ./deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_egress
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *bounded-logs

networks:
  app_egress:
  database:
    internal: true

volumes:
  postgres_data:
  next_cache:
  caddy_data:
  caddy_config:
